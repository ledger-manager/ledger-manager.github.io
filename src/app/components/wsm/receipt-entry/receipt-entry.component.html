 <style>
  input[type="tel"] {
    min-width: 5ch;
    max-width: 5ch;
  }
  .billing-period-panel {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.6rem;
    background-color: #edf4ff;
    border: 1px solid #d6e9ff;
    border-radius: 0.35rem;
  }
  .period-dates {
    font-weight: 600;
    color: #0d6efd;
    min-width: 12rem;
    text-align: center;
  }
  .period-title {
    font-weight: 600;
    white-space: nowrap;
    margin-right: 0.75rem;
  }
  .table-wrapper {
    max-height: calc(100vh - 260px);
    overflow: auto;
  }
  .table-wrapper .p-datatable {
    min-height: auto;
  }
  .p-datatable-sm .p-datatable-thead > tr > th,
  .p-datatable-sm .p-datatable-tbody > tr > td {
    padding: 0.5rem 0.75rem;
  }
</style>
<div class="container mt-4">
  <div class="billing-period-panel d-flex justify-content-between align-items-center flex-wrap mb-3">
    <div class="d-flex align-items-center gap-2">
      <button pButton type="button" icon="pi pi-home" severity="secondary" outlined="true" (click)="goHome()"></button>
      <span class="period-title">Receipt Entry</span>
      <button pButton type="button" icon="pi pi-chevron-left" (click)="goToPreviousDate()" [disabled]="!hasPreviousDate()" severity="secondary" outlined="true"></button>
      <span class="period-dates">{{ formatDisplayDate(selectedDate) }}</span>
      <button pButton type="button" icon="pi pi-chevron-right" (click)="goToNextDate()" [disabled]="!hasNextDate()" severity="secondary" outlined="true"></button>
    </div>
    <div class="d-flex align-items-center gap-2">
      <ng-container *ngIf="isDataLoaded">
        <button pButton type="submit" form="receiptEntryForm" severity="success" [disabled]="isSaving">
          <ng-container *ngIf="!isSaving">Save</ng-container>
          <ng-container *ngIf="isSaving">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Saving...
          </ng-container>
        </button>
      </ng-container>
    </div>
  </div>

  <!-- Loading/Copy progress spinner -->
  <ng-container *ngIf="isLoading || isCopying">
    <div class="text-center mt-4">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">{{ isLoading ? 'Loading' : 'Copying' }}...</span>
      </div>
      <p *ngIf="copyProgress" class="mt-2">{{ copyProgress }}</p>
    </div>
  </ng-container>


  <!-- Data table and form -->
 <ng-container *ngIf="isDataLoaded && !isLoading && !isCopying">
  <ng-container *ngIf="savedMessage">
    <div class="alert mt-2" [ngClass]="{'alert-success': !savedMessage.includes('failed'), 'alert-danger': savedMessage.includes('failed')}" role="alert">
      {{ savedMessage }}
    </div>
  </ng-container>
  <form (ngSubmit)="save()" [formGroup]="form" id="receiptEntryForm" class="mt-3">
    <div class="table-wrapper">
      <p-table [value]="rows.controls" styleClass="p-datatable-sm p-datatable-striped p-datatable-gridlines" formArrayName="rows">
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 70px;">Index</th>
          <th style="width: 250px;">Name</th>
          <th style="width: 8ch;" class="text-end">Q Qty</th>
          <th style="width: 8ch;" class="text-end">P Qty</th>
          <th style="width: 8ch;" class="text-end">N Qty</th>
          <th style="width: 8ch;" class="text-end">D Qty</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row let-i="rowIndex">
        <tr [formGroupName]="i" [class.beer-row]="row.get('group')?.value === 'Beer'">
          <td>{{ i + 1 }}</td>
          <td>{{ row.get('name')?.value }}</td>
            <td class="text-end">
            <input #qqtyInput type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="form-control form-control-sm text-end qty-input" formControlName="qqty" [disabled]="row.get('qqty')?.disabled" (change)="onNumberInput(i, 'qqty', qqtyInput.value)">
          </td>
          <td class="text-end">
            <input #pqtyInput type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="form-control form-control-sm text-end qty-input" formControlName="pqty" [disabled]="row.get('pqty')?.disabled" (change)="onNumberInput(i, 'pqty', pqtyInput.value)">
          </td>
          <td class="text-end">
            <input #nqtyInput type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="form-control form-control-sm text-end qty-input" formControlName="nqty" [disabled]="row.get('nqty')?.disabled" (change)="onNumberInput(i, 'nqty', nqtyInput.value)">
          </td>
          <td class="text-end">
            <input #dqtyInput type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="form-control form-control-sm text-end qty-input" formControlName="dqty" [disabled]="row.get('dqty')?.disabled" (change)="onNumberInput(i, 'dqty', dqtyInput.value)">
          </td>
        </tr>
      </ng-template>
    </p-table>
    </div>
  </form>
  </ng-container>
