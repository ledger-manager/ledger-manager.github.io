<style>
  input[type="tel"] {
    min-width: 5ch;
    max-width: 5ch;
  }
  .billing-period-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    width: 100%;
  }
  .period-dates {
    font-weight: 600;
    color: #0d6efd;
    min-width: 12rem;
    text-align: center;
  }
  .period-title {
    font-weight: 600;
    white-space: nowrap;
    margin-right: 0.75rem;
  }
  .stock-entry-page {
    height: calc(100vh - 1rem);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .stock-entry-table-wrapper,
  .table-wrapper {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .stock-entry-table-wrapper {
    display: flex;
    flex-direction: column;
  }
  .stock-entry-table-wrapper .p-datatable,
  .table-wrapper .p-datatable {
    height: 100%;
  }
  .stock-entry-table {
    --toolbar-row-height: 3.15rem;
  }
  .stock-entry-table .p-datatable-wrapper,
  .stock-entry-table .p-datatable-scrollable-body {
    height: 100%;
  }
  .p-datatable-sm .p-datatable-thead > tr > th,
  .p-datatable-sm .p-datatable-tbody > tr > td {
    padding: 0.5rem 0.75rem;
  }
  .stock-entry-table .p-datatable-table {
    min-width: 44rem;
    border-collapse: separate;
    border-spacing: 0;
  }
  .stock-entry-table .p-frozen-column {
    background: #fff;
  }
  .table-toolbar-cell {
    padding: 0.45rem 0.75rem !important;
    background-color: #edf4ff !important;
    border-color: #d6e9ff !important;
  }
  .stock-entry-table .p-datatable-thead > tr:first-child > th {
    position: sticky;
    top: 0;
    z-index: 9;
  }
  .stock-entry-table .p-datatable-thead > tr.column-header-row > th {
    position: sticky;
    top: var(--toolbar-row-height);
    z-index: 8;
    background: #f8fafc;
  }
  .stock-entry-table .p-datatable-thead > tr.column-header-row > th.p-frozen-column {
    z-index: 10;
  }
  .row-number {
    display: inline-block;
    width: 2ch;
    text-align: right;
  }
  .stock-entry-footer {
    flex-shrink: 0;
    text-align: right;
    color: #6c757d;
    font-size: 0.85rem;
    line-height: 1;
    padding: 0.1rem 0 0.02rem;
    border-top: 1px solid #e9ecef;
    margin-top: 0.12rem;
    margin-bottom: 0;
  }
</style>
<div class="container stock-entry-page">

  <!-- Loading/Copy progress spinner -->
  <ng-container *ngIf="isLoading || isCopying">
    <div class="text-center mt-4">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">{{ isLoading ? 'Loading' : 'Copying' }}...</span>
      </div>
      <p *ngIf="copyProgress" class="mt-2">{{ copyProgress }}</p>
    </div>
    </ng-container>


  <!-- Data table -->
  <ng-container *ngIf="isDataLoaded && !isLoading && !isCopying">
  <form [formGroup]="form" class="stock-entry-table-wrapper">
    <div class="table-wrapper">
      <p-table [value]="rows.controls" [scrollable]="true" scrollHeight="flex" styleClass="stock-entry-table p-datatable-sm p-datatable-striped p-datatable-gridlines" formArrayName="rows">
      <ng-template pTemplate="header">
        <tr>
          <th class="table-toolbar-cell" colspan="5">
            <div class="billing-period-panel d-flex align-items-center flex-wrap gap-2">
              <div class="d-flex align-items-center gap-2">
                <button pButton type="button" icon="pi pi-home" severity="secondary" outlined="true" (click)="goHome()"></button>
                <span class="period-title">Stock Entry</span>
                <button pButton type="button" icon="pi pi-chevron-left" (click)="goToPreviousDate()" [disabled]="!hasPreviousDate()" severity="secondary" outlined="true"></button>
                <span class="period-dates">{{ formatDisplayDate(selectedDate) }}</span>
                <button pButton type="button" icon="pi pi-chevron-right" (click)="goToNextDate()" [disabled]="!hasNextDate()" severity="secondary" outlined="true"></button>
              </div>
              <div class="d-flex align-items-center gap-2 ms-auto">
                <button pButton type="button" (click)="save()" severity="success" [disabled]="isSaving">
                  <ng-container *ngIf="!isSaving">Save</ng-container>
                  <ng-container *ngIf="isSaving">
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Saving...
                  </ng-container>
                </button>
              </div>
            </div>
          </th>
        </tr>
        <tr class="column-header-row">
          <th pFrozenColumn style="width: 173px; min-width: 173px;">Name</th>
          <th style="width: 8ch;" class="text-end">Q</th>
          <th style="width: 8ch;" class="text-end">P</th>
          <th style="width: 8ch;" class="text-end">N</th>
          <th style="width: 8ch;" class="text-end">D</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row let-i="rowIndex">
          <tr [formGroupName]="i" [class.beer-row]="row.get('group')?.value === 'Beer'">
            <td pFrozenColumn><span class="row-number">{{ i + 1 }}</span>. {{ row.get('name')?.value }}</td>
              <td class="text-end">
              <input #qqtyInput type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="form-control form-control-sm text-end qty-input" formControlName="qqty" [disabled]="row.get('qqty')?.disabled" (change)="onNumberInput(i, 'qqty', qqtyInput.value)">
            </td>
            <td class="text-end">
              <input #pqtyInput type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="form-control form-control-sm text-end qty-input" formControlName="pqty" [disabled]="row.get('pqty')?.disabled" (change)="onNumberInput(i, 'pqty', pqtyInput.value)">
            </td>
            <td class="text-end">
              <input #nqtyInput type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="form-control form-control-sm text-end qty-input" formControlName="nqty" [disabled]="row.get('nqty')?.disabled" (change)="onNumberInput(i, 'nqty', nqtyInput.value)">
            </td>
            <td class="text-end">
              <input #dqtyInput type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="form-control form-control-sm text-end qty-input" formControlName="dqty" [disabled]="row.get('dqty')?.disabled" (change)="onNumberInput(i, 'dqty', dqtyInput.value)">
            </td>
          </tr>
      </ng-template>
    </p-table>
    </div>
  </form>
    </ng-container>
  <div class="stock-entry-footer">Developed by Sridhar &copy; 2026</div>
</div>
