<div class="app-home-container">
  <h1>Ledger Manager</h1>
  <div class="app-home-cards">

    <!-- MCM links from mcm/home/home.component.html -->
    @if (canAccessMCM) {
      <div class="home-card" (click)="goTo('mcm/ledger-entry')">
        <span class="card-title">Ledger Entry</span>
      </div>
      <div class="home-card" (click)="goTo('mcm/rate-card')">
        <span class="card-title">Rate Card</span>
      </div>
      <div class="home-card" (click)="goTo('mcm/customers')">
        <span class="card-title">Customers</span>
      </div>
    }

    <!-- WSM links from wsm/home/home.component.html -->
    @if (canAccessWSM) {
      <div class="home-card" (click)="goTo('wsm/stock-entry')">
        <span class="card-title">Stock Entry</span>
      </div>
      <div class="home-card" (click)="goTo('wsm/receipt-entry')">
        <span class="card-title">Receipt Entry</span>
      </div>

      <div class="home-card" (click)="goTo('wsm/day-sales')">
        <span class="card-title">Day Sales</span>
      </div>
      
      <div class="home-card" (click)="goTo('wsm/r1-report')">   
        <span class="card-title">R-1 Report</span>
      </div>
      
      <div class="home-card" (click)="goTo('wsm/prices')">
        <span class="card-title">Price List</span>
      </div>
    }

    <div class="home-card logout-card" (click)="logout()">
      <span class="card-title">Logout</span>
    </div>

  </div>
</div>
